# Crocbot X — Docker Compose for the Linux VPS.
# NOT deployed by this repo's build step. The deploy agent runs:
#   cp .env.example .env   # fill on the server, chmod 600
#   docker compose up -d --build
# Caddy is the only public entry (80/443). Postgres/Redis are NOT
# host-exposed. Set CROCBOT_DOMAIN in .env (e.g. chat.example.com).

services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    restart: unless-stopped

  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://crocbot:${POSTGRES_PASSWORD}@postgres:5432/crocbot
      REDIS_URL: redis://redis:6379/0
      CROCBOT_HOST: 0.0.0.0
    volumes:
      - crocbot_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Resource limits (architecture principle #2). Tune per VPS size.
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    restart: unless-stopped

  # One worker per bot (architecture principle: isolation / resource
  # limits / clean state are PRINCIPLES, not workers — every worker
  # gets all three). The deploy agent adds one service per bot here,
  # each its own container, e.g. worker-time-auditor below. A bot's
  # worker runs ONLY that bot's scheduled turns.
  worker-time-auditor:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://crocbot:${POSTGRES_PASSWORD}@postgres:5432/crocbot
    volumes:
      - crocbot_data:/app/data
    command: ["python", "-m", "app.agent.worker", "--bot", "time-auditor", "--interval-s", "86400"]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://crocbot:${POSTGRES_PASSWORD}@postgres:5432/crocbot
    volumes:
      - crocbot_data:/app/data
    # Generic worker template — kept for bots without a dedicated
    # service yet. Prefer one named service per bot (see above).
    command: ["python", "-m", "app.agent.worker", "--bot", "time-auditor", "--once"]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: crocbot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: crocbot
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crocbot -d crocbot"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Optional profiles (not started by default):
  #   docker compose --profile local-search up -d
  #   docker compose --profile local-llm up -d   (GPU VPS only)
  searxng:
    profiles: ["local-search"]
    image: searxng/searxng:latest
    environment:
      SEARXNG_BASE_URL: http://searxng:8080/
    restart: unless-stopped

  ollama:
    profiles: ["local-llm"]
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
  crocbot_data:
  pgdata:
  redisdata:
  ollama_data:
